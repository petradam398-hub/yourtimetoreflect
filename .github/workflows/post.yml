name: Post to Instagram

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min; publish.py waits for the exact time in config.json
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = render only, check = test token without posting, force = publish one post now"
        type: choice
        options: [dry, check, force]
        default: dry

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Make sure ffmpeg is there (for reels)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.mode == 'dry' && '1' || '0' }}
          FORCE: ${{ github.event.inputs.mode == 'force' && '1' || '0' }}
          CHECK: ${{ github.event.inputs.mode == 'check' && '1' || '0' }}
        run: |
          git config user.name "yourtimetoreflect-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python publish.py
      - name: Keep rendered preview (dry run)
        if: github.event.inputs.mode == 'dry'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            posts/*.jpg
            posts/*.mp4
